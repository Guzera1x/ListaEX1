<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Exercício 5</title>
</head>
<body>
    <form>
        <input type="radio" id="dom" name="dia" value="domingo" />
        <label for="dom">Domingo</label>

        <input type="radio" id="seg" name="dia" value="segunda" checked />
        <label for="seg">Segunda-feira</label>

        <input type="radio" id="ter" name="dia" value="terca" />
        <label for="ter">Terça-feira</label>

        <input type="radio" id="qua" name="dia" value="quarta" />
        <label for="qua">Quarta-feira</label>

        <input type="radio" id="qui" name="dia" value="quinta" />
        <label for="qui">Quinta-feira</label>

        <input type="radio" id="sex" name="dia" value="sexta" />
        <label for="sex">Sexta-feira</label>

        <input type="radio" id="sab" name="dia" value="sabado" />
        <label for="sab">Sábado</label>
    </form>
</body>
</html>
