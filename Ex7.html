<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Exercício 7</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Dias da Semana</legend>
            <div>
                <input type="checkbox" id="f-dom" name="dias[]" value="domingo" />
                <label for="f-dom">Domingo</label>
            </div>
            <div>
                <input type="checkbox" id="f-seg" name="dias[]" value="segunda" checked />
                <label for="f-seg">Segunda-feira</label>
            </div>
            <div>
                <input type="checkbox" id="f-ter" name="dias[]" value="terca" />
                <label for="f-ter">Terça-feira</label>
            </div>
            <div>
                <input type="checkbox" id="f-qua" name="dias[]" value="quarta" />
                <label for="f-qua">Quarta-feira</label>
            </div>
            <div>
                <input type="checkbox" id="f-qui" name="dias[]" value="quinta" checked />
                <label for="f-qui">Quinta-feira</label>
            </div>
            <div>
                <input type="checkbox" id="f-sex" name="dias[]" value="sexta" />
                <label for="f-sex">Sexta-feira</label>
            </div>
            <div>
                <input type="checkbox" id="f-sab" name="dias[]" value="sabado" />
                <label for="f-sab">Sábado</label>
            </div>
        </fieldset>
    </form>
</body>
</html>
