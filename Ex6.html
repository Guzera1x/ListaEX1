<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Exercício 6</title>
</head>
<body>
    <form>
        <input type="checkbox" id="chk-dom" name="dias[]" value="domingo" />
        <label for="chk-dom">Domingo</label>

        <input type="checkbox" id="chk-seg" name="dias[]" value="segunda" checked />
        <label for="chk-seg">Segunda-feira</label>

        <input type="checkbox" id="chk-ter" name="dias[]" value="terca" />
        <label for="chk-ter">Terça-feira</label>

        <input type="checkbox" id="chk-qua" name="dias[]" value="quarta" />
        <label for="chk-qua">Quarta-feira</label>

        <input type="checkbox" id="chk-qui" name="dias[]" value="quinta" checked />
        <label for="chk-qui">Quinta-feira</label>

        <input type="checkbox" id="chk-sex" name="dias[]" value="sexta" />
        <label for="chk-sex">Sexta-feira</label>

        <input type="checkbox" id="chk-sab" name="dias[]" value="sabado" />
        <label for="chk-sab">Sábado</label>
    </form>
</body>
</html>
